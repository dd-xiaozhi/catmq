# CatMQ Admin 管理平台配置
server:
  port: 8080
  servlet:
    context-path: /admin

spring:
  application:
    name: catmq-admin

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Spring Mail 配置（需要启用邮件通知时配置）
  mail:
    host: smtp.example.com
    port: 587
    username: alert@catmq.com
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 管理平台配置
catmq:
  admin:
    # 指标采集间隔（毫秒）
    metrics-collection-interval: 5000
    # 告警检查间隔（毫秒）
    alert-check-interval: 10000
    # 健康检查间隔（毫秒）
    health-check-interval: 30000
    # 告警通知配置
    alert:
      notifier:
        # 邮件通知配置
        email:
          enabled: false
          from-address: alert@catmq.com
          to-addresses:
            - admin@catmq.com
          smtp-host: smtp.example.com
          smtp-port: 587
          username: alert@catmq.com
          password: ""
        # 钉钉通知配置
        dingtalk:
          enabled: false
          webhook-url: ""
          secret: ""
          at-mobiles: []
        # 企业微信通知配置
        wechat:
          enabled: false
          webhook-url: ""

# Spring Boot Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# 日志配置
logging:
  level:
    com.aoaojiao.catmq: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"