# CatMQ 集群配置
# 用于配置高可用集群的相关参数

# ============ ZooKeeper 配置 ============
# ZooKeeper 服务器地址，多个地址用逗号分隔
catmq.cluster.zk-address=localhost:2181

# ZooKeeper 连接超时时间（毫秒）
catmq.cluster.zk.connection-timeout-ms=15000

# ZooKeeper 会话超时时间（毫秒）
catmq.cluster.zk.session-timeout-ms=60000

# ZooKeeper 根节点路径
catmq.cluster.zk.root-path=/catmq

# Broker 注册节点路径
catmq.cluster.zk.broker-registry-path=/catmq/brokers

# Controller 选举路径
catmq.cluster.zk.controller-election-path=/catmq/controller

# ============ Broker 配置 ============
# 本 Broker 唯一标识
catmq.cluster.broker.id=broker-001

# Broker 名称（用于逻辑分组）
catmq.cluster.broker.name=default-group

# Broker 主机地址
catmq.cluster.broker.host=localhost

# Broker 端口
catmq.cluster.broker.port=9000

# ============ 负载均衡配置 ============
# 负载均衡策略：ROUND_ROBIN / RANDOM / CONSISTENT_HASH
catmq.cluster.load-balance.strategy=ROUND_ROBIN

# 一致性哈希虚拟节点数量
catmq.cluster.load-balance.virtual-node-count=100

# ============ 主从同步配置 ============
# 同步模式：SYNC / ASYNC / SEMI_SYNC
catmq.cluster.sync.mode=ASYNC

# 复制因子（半同步模式下需要等待的从节点数量）
catmq.cluster.sync.replication-factor=1

# ============ 高可用配置 ============
# 是否启用高可用
catmq.cluster.ha.enabled=true

# 心跳检测间隔（毫秒）
catmq.cluster.ha.heartbeat-interval-ms=30000

# 节点超时时间（毫秒）
catmq.cluster.ha.node-timeout-ms=120000

# 重新选举间隔（毫秒）
catmq.cluster.ha.rebalance-interval-ms=60000